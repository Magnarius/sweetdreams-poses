<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Sweet Dreams — позы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;600&display=swap">
<style>
/* Лента кадров по порядку; тап — кадр на весь экран, листание свайпом и стрелками */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --fg: #1d2421;
  --muted: #5d6762;
  --line: #dcdfd9;
  --accent: #0f6b5c;
  --accent-fg: #ffffff;
  --display: "Unbounded", "Arial Black", sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614; --surface: #1b211e; --fg: #e8ece9; --muted: #9aa59f;
    --line: #2c3430; --accent: #4fc2a9; --accent-fg: #0c1311; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 16px 48px; display: grid; gap: 16px; }
h1 { font: 700 1.5rem/1.15 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
.sub a { color: inherit; }

.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: 8px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.group { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
button {
  font: 600 .85rem/1 var(--body); color: var(--fg); background: var(--surface);
  border: 0; padding: 10px 12px; cursor: pointer; min-height: 40px;
}
.group button + button { border-left: 1px solid var(--line); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.grid { display: grid; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); gap: 12px; }
@media (min-width: 700px) { .grid { --cols: 2; } }
@media (min-width: 1000px) { .grid { --cols: 3; } }
.grid.dense { --cols: 2; }
@media (min-width: 700px) { .grid.dense { --cols: 4; } }
.card { margin: 0; display: grid; gap: 4px; }
.card button { padding: 0; border-radius: 6px; overflow: hidden; background: #000; min-height: 0; }
.card img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.card figcaption { display: flex; gap: 8px; align-items: baseline; font-variant-numeric: tabular-nums; }
.card b { font: 700 1rem/1 var(--display); }
.card a { color: var(--muted); font-size: .85rem; }
.mirror .card img, .mirror .view img { transform: scaleX(-1); }

.view {
  position: fixed; inset: 0; z-index: 10; background: #000; color: #fff;
  display: none; grid-template-rows: auto 1fr auto;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px))
           max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.view.open { display: grid; }
.view .top, .view .nav { display: flex; gap: 8px; align-items: center; }
.view .top b { font: 700 1.1rem/1 var(--display); }
.view .top span { color: #bbb; font-variant-numeric: tabular-nums; }
.view .top button { margin-left: auto; }
.view .stage { min-height: 0; display: grid; place-items: center; touch-action: pan-y; }
.view img { max-width: 100%; max-height: 100%; object-fit: contain; }
.view .nav button { flex: 1; }
.view button { background: #222; color: #fff; }

.lock { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lock input {
  font: 16px var(--body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; min-height: 40px; width: 12em;
}
.lock button { background: var(--accent); color: var(--accent-fg); border-radius: 6px; }
.lock .msg { color: var(--muted); font-size: .9rem; width: 100%; margin: 0; }
.locked .bar { display: none; }
</style>
</head>
<body>
<div class="wrap locked" id="wrap">
  <header>
    <h1>Sweet Dreams — позы</h1>
    <p class="sub">82 позы по порядку, отрезок 0:08–1:09. Кадры из видео
      <a href="https://youtu.be/dRewnIJosuo" target="_blank" rel="noopener">Sweet dreams — LUAM Choreography, GH5 Dance Studio</a>.
      Тап по кадру — на весь экран; таймкод — этот момент в ролике.</p>
  </header>

  <form class="lock" id="lock">
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" aria-label="Пароль">
    <button type="submit">Открыть</button>
    <p class="msg" id="msg"></p>
  </form>

  <div class="bar">
    <div class="group">
      <button id="mirror" aria-pressed="false">Зеркало</button>
      <button id="dense" aria-pressed="false">Мельче</button>
    </div>
  </div>

  <main class="grid" id="grid"></main>
</div>

<div class="view" id="view" role="dialog" aria-modal="true" aria-label="Поза">
  <div class="top"><b id="vn"></b><span id="vt"></span><button id="close" aria-label="Закрыть">✕</button></div>
  <div class="stage" id="stage"><img id="vimg" alt=""></div>
  <div class="nav"><button id="vprev">◀ Назад</button><button id="vnext">Вперёд ▶</button></div>
</div>

<script>
const VIDEO = 'dRewnIJosuo';
const TIMES = [8.17,8.77,9.77,10.70,11.70,12.57,13.50,14.37,15.13,15.90,16.43,17.23,18.03,18.87,19.70,20.43,21.06,21.70,22.30,22.77,23.43,24.23,24.77,25.57,26.10,26.63,27.10,27.97,28.60,29.23,29.70,30.37,31.30,31.97,32.63,33.30,33.70,34.17,34.70,35.63,36.17,37.10,38.30,39.10,40.03,40.97,41.90,42.83,43.50,44.37,44.90,45.63,46.30,47.43,48.50,49.37,50.03,50.70,51.34,51.97,52.83,53.77,54.44,55.10,56.17,56.57,57.37,58.30,59.10,59.68,60.25,60.83,61.83,62.43,63.03,63.63,64.83,65.50,66.17,67.10,67.57,68.37];

const fmt = s => { const m = Math.floor(s / 60); return m + ':' + (s - m * 60).toFixed(1).padStart(4, '0').replace('.', ','); };
let IMGS = [];
const src = i => IMGS[i];
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// poses.enc = соль(16) + iv(12) + AES-GCM от JSON-массива картинок; ключ — PBKDF2 от пароля
let blob = null;
async function unlock(pw) {
  blob = blob || new Uint8Array(await (await fetch('poses.enc')).arrayBuffer());
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: blob.slice(0, 16), iterations: 300000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: blob.slice(16, 28) }, key, blob.slice(28));
  IMGS = JSON.parse(new TextDecoder().decode(plain));
}
const msg = document.getElementById('msg');
async function tryOpen(pw, quiet) {
  if (!quiet) msg.textContent = 'Открываю…';
  try { await unlock(pw); } catch { msg.textContent = quiet ? '' : 'Не тот пароль'; return; }
  store.set('sd-pw', pw);
  document.getElementById('lock').remove();
  document.getElementById('wrap').classList.remove('locked');
  build();
}
document.getElementById('lock').onsubmit = e => { e.preventDefault(); tryOpen(document.getElementById('pw').value.trim()); };
if (store.get('sd-pw')) tryOpen(store.get('sd-pw'), true);

const grid = document.getElementById('grid');
function build() {
TIMES.forEach((t, i) => {
  const f = document.createElement('figure');
  f.className = 'card'; f.id = 'p' + (i + 1);
  f.innerHTML = `<button aria-label="Поза ${i + 1} на весь экран"><img src="${src(i)}" alt="Поза ${i + 1}" loading="lazy" width="800" height="450"></button>
    <figcaption><b>${i + 1}</b><a href="https://youtu.be/${VIDEO}?t=${Math.floor(t)}" target="_blank" rel="noopener">${fmt(t)}</a></figcaption>`;
  f.querySelector('button').onclick = () => open(i);
  grid.append(f);
});
}

function toggle(id, cls, el, key) {
  const b = document.getElementById(id);
  b.onclick = () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on));
    el.classList.toggle(cls, on);
    store.set(key, on ? '1' : '0');
  };
  if (store.get(key) === '1') b.click();
}
toggle('mirror', 'mirror', document.body, 'sd-mirror');
toggle('dense', 'dense', grid, 'sd-dense');

// просмотр на весь экран
const view = document.getElementById('view');
let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(TIMES.length - 1, i));
  document.getElementById('vimg').src = src(cur);
  document.getElementById('vimg').alt = 'Поза ' + (cur + 1);
  document.getElementById('vn').textContent = cur + 1 + ' / ' + TIMES.length;
  document.getElementById('vt').textContent = fmt(TIMES[cur]);
  if (cur + 1 < TIMES.length) new Image().src = src(cur + 1);
}
function open(i) { show(i); view.classList.add('open'); document.body.style.overflow = 'hidden'; }
function close() {
  view.classList.remove('open'); document.body.style.overflow = '';
  document.getElementById('p' + (cur + 1)).scrollIntoView({ block: 'center' });
}
document.getElementById('close').onclick = close;
document.getElementById('vprev').onclick = () => show(cur - 1);
document.getElementById('vnext').onclick = () => show(cur + 1);
document.addEventListener('keydown', e => {
  if (!view.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') show(cur - 1);
  if (e.key === 'ArrowRight') show(cur + 1);
  if (e.key === 'Escape') close();
});
let x0 = null;
const stage = document.getElementById('stage');
stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
});
stage.addEventListener('click', e => { if (e.target === stage) close(); });
</script>
</body>
</html>
