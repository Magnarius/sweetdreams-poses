<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sweet Dreams — позы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;600&display=swap">
<style>
/* Видео сверху и липкое; под ним сетка поз — тап ставит видео на паузу ровно на позе */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --fg: #1d2421;
  --muted: #5d6762;
  --line: #dcdfd9;
  --accent: #0f6b5c;
  --accent-fg: #ffffff;
  --display: "Unbounded", "Arial Black", sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614; --surface: #1b211e; --fg: #e8ece9; --muted: #9aa59f;
    --line: #2c3430; --accent: #4fc2a9; --accent-fg: #0c1311; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg); font: 16px/1.55 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; padding-block: 16px 48px; display: grid; gap: 16px; }
h1 { font: 700 1.5rem/1.15 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: .9rem; margin: 4px 0 0; }
.sub a { color: inherit; }

.player {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  padding-top: max(8px, env(safe-area-inset-top, 0px)); padding-bottom: 8px;
  display: grid; gap: 8px;
}
.frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 6px; overflow: hidden; }
.frame.mirror #yt { transform: scaleX(-1); }
#yt { position: absolute; inset: 0; width: 100%; height: 100%; }

.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
button {
  font: 600 .85rem/1 var(--body); color: var(--fg); background: var(--surface);
  border: 0; padding: 10px 12px; cursor: pointer; min-height: 40px;
}
.group button + button { border-left: 1px solid var(--line); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.now { font-size: .85rem; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

.poses { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
.pose {
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 4px;
  display: grid; gap: 2px; justify-items: center; line-height: 1.1;
}
.pose b { font: 700 1rem/1 var(--display); }
.pose small { font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.pose[aria-pressed="true"] small { color: inherit; opacity: .85; }
.hint { color: var(--muted); font-size: .9rem; margin: 0; max-width: 65ch; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sweet Dreams — позы</h1>
    <p class="sub">Отрезок 0:08–1:09. Видео: <a href="https://youtu.be/dRewnIJosuo" target="_blank" rel="noopener">Sweet dreams — LUAM Choreography, GH5 Dance Studio</a></p>
  </header>

  <section class="player">
    <div class="frame" id="frame"><div id="yt"></div></div>
    <div class="controls">
      <div class="group">
        <button id="prev" aria-label="Предыдущая поза">◀</button>
        <button id="next" aria-label="Следующая поза">▶</button>
      </div>
      <div class="group">
        <button id="step">Переход ▸</button>
      </div>
      <div class="group" role="group" aria-label="Скорость">
        <button data-rate="0.5">0,5×</button>
        <button data-rate="0.75">0,75×</button>
        <button data-rate="1" aria-pressed="true">1×</button>
      </div>
      <div class="group">
        <button id="mirror" aria-pressed="false">Зеркало</button>
      </div>
      <span class="now" id="now"></span>
    </div>
  </section>

  <p class="hint">Тап по номеру — видео встаёт на паузу на этой позе. ◀ ▶ — соседние позы (на компьютере — стрелки).
    «Переход» проигрывает путь от текущей позы до следующей и снова останавливается.</p>
  <nav class="poses" id="poses" aria-label="Позы"></nav>
</div>

<script>
const VIDEO = 'dRewnIJosuo';
// моменты фиксации поз, сек
const POSES = [8.17,8.77,9.77,10.70,11.70,12.57,13.50,14.37,15.13,15.90,16.43,17.23,18.03,18.87,19.70,20.43,21.06,21.70,22.30,22.77,23.43,24.23,24.77,25.57,26.10,26.63,27.10,27.97,28.60,29.23,29.70,30.37,31.30,31.97,32.63,33.30,33.70,34.17,34.70,35.63,36.17,37.10,38.30,39.10,40.03,40.97,41.90,42.83,43.50,44.37,44.90,45.63,46.30,47.43,48.50,49.37,50.03,50.70,51.34,51.97,52.83,53.77,54.44,55.10,56.17,56.57,57.37,58.30,59.10,59.68,60.25,60.83,61.83,62.43,63.03,63.63,64.83,65.50,66.17,67.10,67.57,68.37];
const END = 69.2;

const fmt = s => { const m = Math.floor(s / 60), r = s - m * 60; return m + ':' + r.toFixed(1).padStart(4, '0').replace('.', ','); };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

let player, ready = false, cur = 0, rate = 1, stopAt = null;

const posesEl = document.getElementById('poses');
POSES.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'pose'; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<b>${i + 1}</b><small>${fmt(t)}</small>`;
  b.onclick = () => go(i);
  posesEl.append(b);
});

function mark(i) {
  cur = i;
  [...posesEl.children].forEach((b, j) => b.setAttribute('aria-pressed', String(j === i)));
  store.set('sd-pose', String(i));
}

function go(i) {
  i = Math.max(0, Math.min(POSES.length - 1, i));
  mark(i);
  stopAt = null;
  if (ready) { player.seekTo(POSES[i], true); player.pauseVideo(); }
}

document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
document.getElementById('step').onclick = () => {
  if (!ready) return;
  const nxt = cur + 1 < POSES.length ? POSES[cur + 1] : END;
  player.seekTo(POSES[cur], true);
  stopAt = { t: nxt, i: Math.min(cur + 1, POSES.length - 1) };
  player.playVideo();
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') go(cur - 1);
  if (e.key === 'ArrowRight') go(cur + 1);
});

for (const b of document.querySelectorAll('[data-rate]')) {
  b.onclick = () => {
    rate = +b.dataset.rate;
    for (const x of document.querySelectorAll('[data-rate]')) x.setAttribute('aria-pressed', String(x === b));
    if (ready) player.setPlaybackRate(rate);
  };
}
const mirrorBtn = document.getElementById('mirror');
mirrorBtn.onclick = () => {
  const on = mirrorBtn.getAttribute('aria-pressed') !== 'true';
  mirrorBtn.setAttribute('aria-pressed', String(on));
  document.getElementById('frame').classList.toggle('mirror', on);
  store.set('sd-mirror', on ? '1' : '0');
};

if (store.get('sd-mirror') === '1') mirrorBtn.click();
mark(Math.min(+store.get('sd-pose') || 0, POSES.length - 1));

function onYouTubeIframeAPIReady() {
  player = new YT.Player('yt', {
    videoId: VIDEO,
    playerVars: { start: Math.floor(POSES[cur]), playsinline: 1, rel: 0, modestbranding: 1 },
    events: {
      onReady: () => { ready = true; player.seekTo(POSES[cur], true); player.pauseVideo(); },
      onStateChange: e => { if (e.data === YT.PlayerState.PLAYING) player.setPlaybackRate(rate); },
    },
  });
}

// «Переход»: останавливаемся на следующей позе; при обычном проигрывании подсвечиваем текущую
setInterval(() => {
  if (!ready) return;
  const t = player.getCurrentTime();
  document.getElementById('now').textContent = fmt(t);
  if (stopAt && t >= stopAt.t - 0.05) {
    player.pauseVideo(); player.seekTo(stopAt.t, true); mark(stopAt.i); stopAt = null;
  } else if (!stopAt && player.getPlayerState() === YT.PlayerState.PLAYING) {
    let i = 0; while (i + 1 < POSES.length && POSES[i + 1] <= t + 0.05) i++;
    if (i !== cur && t >= POSES[0]) mark(i);
  }
}, 50);
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
